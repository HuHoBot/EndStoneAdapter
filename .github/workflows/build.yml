name: Build & Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'xmake.lua'
    tags:
      - 'v*' # 匹配 v 开头的标签
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'xmake.lua'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows (MSVC)
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
        
    - name: Build Plugin (Debug)
      run: xmake config --mode=debug -y && xmake --all -y
      
    - name: Build Plugin (Release)
      run: xmake config --mode=release -y && xmake --all -y

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}-windows-x86_64
        path: |
          bin/


  build-linux:
    name: Build on Linux (Clang)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Clang
      run: sudo apt-get update && sudo apt-get install -y clang

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libc++-dev libc++abi-dev
      
    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
        
    - name: Build Plugin (Debug)
      run: xmake config --mode=debug -y && xmake --all -y
      
    - name: Build Plugin (Release)
      run: xmake config --mode=release -y && xmake --all -y

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}-linux-x86_64
        path: |
          bin/


  upload-to-release:
    name: Publish Release
    needs:
      - build-windows
      - build-linux
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows-x86_64
          path: artifact

      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-linux-x86_64
          path: artifact

      - name: Extract release info
        id: changelog
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          
          # 修复：使用正确的标签格式匹配
          VERSION=${TAG_NAME#v}  # 去除v前缀（如果CHANGELOG使用纯版本号）
          
          CHANGELOG_CONTENT=$(awk -v version="[v$VERSION]" '
            BEGIN {RS="## "; FS="\n"}
            $1 ~ version {
              sub(/\[.*\] - .*\n/, "")
              gsub(/`/, "\\`")
              gsub(/"/, "\\\"")
              print
              exit
            }
          ' CHANGELOG.md)
          
          EOF_MARKER=$(openssl rand -base64 12)
          echo "body<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT
          
          # 添加标签名输出
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Rename release files
        run: |    
          cd artifacts
          TAG_NAME=${{ steps.changelog.outputs.tag_name }}

          # 处理Windows文件
          for file in *.dll *.pdb; do
            new_name="${file%.*}_${TAG_NAME}.${file##*.}"
            mv "$file" "$new_name"
          done

          # 处理Linux文件
          for file in *.so; do
            new_name="${file%.*}_${TAG_NAME}.so"
            mv "$file" "$new_name"
          done

      - name: Get timestamp
        id: get-time
        run: echo "TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1  # 改用更可靠的 Action
        with:
          tag_name: ${{ steps.changelog.outputs.tag_name }}
          name: HuHoBot ${{ steps.changelog.outputs.tag_name }}
          body: |
            ${{ steps.changelog.outputs.body }}
            
            ### 构建信息
            - 构建时间: ${{ steps.get-time.outputs.TIME }}
            - 提交哈希: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            
            ### 下载说明
            - Linux: 
              - 插件本体: [huhobot_${{ steps.changelog.outputs.tag_name }}.so](https://github.com/HuHoBot/EndStoneAdapter/releases/download/${{ steps.changelog.outputs.tag_name }}/huhobot_${{ steps.changelog.outputs.tag_name }}.so)
            - Windows:
              - 插件本体: [huhobot_${{ steps.changelog.outputs.tag_name }}.dll](https://github.com/HuHoBot/EndStoneAdapter/releases/download/${{ steps.changelog.outputs.tag_name }}/huhobot_${{ steps.changelog.outputs.tag_name }}.dll)
              - 插件调试信息: [huhobot_${{ steps.changelog.outputs.tag_name }}.pdb](https://github.com/HuHoBot/EndStoneAdapter/releases/download/${{ steps.changelog.outputs.tag_name }}/huhobot_${{ steps.changelog.outputs.tag_name }}.pdb)

          files: |
            artifacts/**